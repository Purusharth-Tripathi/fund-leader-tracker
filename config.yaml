# ETF Sector Leadership Planner Configuration

sectors:
  - name: "Aerospace & Defense"
    keywords: ["aerospace", "defense", "aviation", "military"]
  - name: "Renewable Energy"
    keywords: ["solar", "wind", "renewable", "clean energy", "green energy"]
  - name: "Healthcare & Biotech"
    keywords: ["healthcare", "biotech", "pharmaceutical", "medical", "health"]
  - name: "Automotive"
    keywords: ["automotive", "automobile", "electric vehicle", "EV", "car"]
  - name: "Precious Metals"
    keywords: ["gold", "silver", "platinum", "precious metals", "mining"]
  - name: "Consumer Staples"
    keywords: ["consumer staples", "food", "beverage", "household", "retail"]
  - name: "Tech & AI"
    keywords: ["technology", "artificial intelligence", "AI", "software", "cloud"]
  - name: "Financial Services"
    keywords: ["financial", "banking", "insurance", "fintech", "asset management"]
  - name: "Infrastructure"
    keywords: ["infrastructure", "construction", "utilities", "industrial"]
  - name: "Real Estate"
    keywords: ["real estate", "REIT", "property", "residential", "commercial"]

analysis:
  top_funds_per_sector: 5
  min_holding_threshold: 1.0
  performance_period: "3year"
  export_top_n_leaders: 10
  allow_uninitialized_sector_fallback: false

strategy:
  review_cadence: "weekly"
  action_cadence: "monthly"
  monthly_action_day: 5
  confirmation_reviews_required: 2
  leader_rules:
    min_times_held: 3
    min_prevalence_pct: 60.0
    min_avg_weight_pct: 1.0
  significant_change:
    score_gap_pct: 1.5
    prevalence_gap_pct: 20.0
    allow_invalid_current_override: true
  sector_fallbacks:
    "Aerospace & Defense": { symbol: "ITA", name: "iShares U.S. Aerospace & Defense ETF" }
    "Renewable Energy": { symbol: "ICLN", name: "iShares Global Clean Energy ETF" }
    "Healthcare & Biotech": { symbol: "XLV", name: "Health Care Select Sector SPDR Fund" }
    "Automotive": { symbol: "DRIV", name: "Global X Autonomous & Electric Vehicles ETF" }
    "Precious Metals": { symbol: "GLD", name: "SPDR Gold Shares" }
    "Consumer Staples": { symbol: "XLP", name: "Consumer Staples Select Sector SPDR Fund" }
    "Tech & AI": { symbol: "XLK", name: "Technology Select Sector SPDR Fund" }
    "Financial Services": { symbol: "XLF", name: "Financial Select Sector SPDR Fund" }
    "Infrastructure": { symbol: "PAVE", name: "Global X U.S. Infrastructure Development ETF" }
    "Real Estate": { symbol: "VNQ", name: "Vanguard Real Estate ETF" }

api:
  requests_per_minute: 5
  requests_per_day: 25
  retry_attempts: 3
  retry_delay: 5
  timeout_seconds: 20
  verify_ssl: true
  cache_directory: "data/cache"
  holdings_cache_ttl_hours: 168
  holdings_provider_order: ["fmp", "cache", "alpha_vantage"]
  fmp_base_url: "https://financialmodelingprep.com"

output:
  database_path: "data/fund_leaders.db"
  save_to_csv: true
  save_to_json: true
  csv_path: "output/leaders.csv"
  json_path: "output/leaders.json"
  report_directory: "output/reports"

email_alerts:
  enabled: false
  send_on_completion: false
  send_on_change_only: false
  include_top_n_leaders: 10
